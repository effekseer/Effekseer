on:
  release:
    types: [published]
  push:
    branches:
      - master
      - 15x
      - 16x
      - 16x_ex
      - 17x

  pull_request:
    branches:
      - master
      - 15x
      - 16x
      - 16x_ex
      - 17x

jobs:
  win_x86_build:
    name: Build Windows(x86)
    runs-on: windows-2022
    steps:
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'

      - uses: actions/checkout@v2
      - run: |
         git submodule update --init
         git lfs install
         git lfs pull

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: |
         cmake -S . -B build -A Win32 -DBUILD_VIEWER=ON -D BUILD_TEST=ON -D BUILD_EXAMPLES=ON
         cmake --build ./build/ --config Release
        shell: cmd

  tests:
    name: Run Tests
    runs-on: windows-2022
    steps:
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Pip
        run: |
         python -m pip install setuptools pillow
        shell: cmd

      - uses: actions/checkout@v2
      - run: |
         git submodule update --init
         git lfs install
         git lfs pull

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: python build.py from_ci
        shell: cmd

      - name: Test
        run: |
         cd build/Dev/Cpp/Test/Release/
         TestCpp.exe
        shell: cmd

      - name: Test screenshots
        run: python Script/test_screenshot.py
        shell: cmd

      - name: Upload Test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test
          path: build/Dev/Cpp/Test/Release/

  BuildLinux:
    name: Build on linux
    runs-on: ubuntu-22.04
    container:
      image: rockylinux:8
    steps:
      - name: Install Linux Dependencies
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf install -y \
               alsa-lib-devel ca-certificates cmake curl file findutils gcc gcc-c++ git git-lfs gzip \
               icu krb5-libs make ninja-build openssl-libs python3.12 python3.12-pip tar unzip which \
               libglvnd-devel libX11-devel libXcursor-devel libXi-devel libXinerama-devel libXrandr-devel \
               libXxf86vm-devel libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel xcb-util-devel \
               xcb-util-keysyms-devel xorg-x11-xkb-utils mesa-libEGL-devel mesa-libGL-devel mesa-libGLU-devel \
               gtk3-devel openal-soft-devel pulseaudio-libs-devel vulkan-headers vulkan-loader-devel \
               wayland-devel wayland-protocols-devel zenity

      - name: Show glibc version
        run: |
          ldd --version
          getconf GNU_LIBC_VERSION
          python3.12 --version

      - name: Pip
        run: |
          python3.12 -m pip install setuptools pillow

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
          lfs: true

      - name: Resolve Effekseer version
        id: version
        shell: bash
        run: |
          VERSION="$(python3.12 -c 'import build; print(build.get_editor_version())')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Build
        shell: bash
        run: |
          python3.12 build.py

      - name: Prepare Linux Tool
        run: |
          python3.12 release_tool.py

      - name: Upload linux Tool
        uses: actions/upload-artifact@v4
        with:
          name: Effekseer${{ steps.version.outputs.value }}Linux
          path: EffekseerTool

  Build:
    strategy:
      fail-fast: true
      matrix:
        name: [windows_x64,mac]
        include:
          - name: windows_x64
            os: windows-2022
            label: Win
          - name: mac
            os: macos-14
            label: Mac

    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Pip
        run: |
          python -m pip install setuptools pillow
          python3 -m pip install setuptools pillow

      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 1

      - name: Resolve Effekseer version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 -c 'import build; print(build.get_editor_version())' 2>/dev/null || python -c 'import build; print(build.get_editor_version())')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - run: |
          git lfs install
          git lfs pull

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "mac" ];
          then
              export PACKAGEING_FOR_MAC=1
              sudo xcode-select --switch /Applications/Xcode_15.0.1.app
          fi
          python3 build.py || python build.py

      - name: Validate architecture-specific macOS packages
        if: matrix.name == 'mac'
        shell: bash
        run: |
          EDITOR_VERSION="$(python3 -c 'import build; print(build.get_editor_version())')"
          for ARCH in arm64 x64
          do
            RID="osx-$ARCH"
            APP="build/macos-packaging/$RID/Effekseer.app"
            RESOURCES="$APP/Contents/Resources"

            test -d "$APP"
            test -f "EffekseerTool/Mac-$ARCH/Effekseer.dmg"
            test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$EDITOR_VERSION"
            test "$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")" = "$EDITOR_VERSION"
            test "$(plutil -extract LSMinimumSystemVersion raw "$APP/Contents/Info.plist")" = "12.0"
            grep -q "$RID" "$RESOURCES/Effekseer.deps.json"

            if [ "$ARCH" = "arm64" ]; then
              EXPECTED_MACHO_ARCH="arm64"
              EXPECTED_MANAGED_ARCH="Aarch64"
            else
              EXPECTED_MACHO_ARCH="x86_64"
              EXPECTED_MANAGED_ARCH="x86-64"
            fi

            for FILE in Effekseer libhostfxr.dylib libcoreclr.dylib
            do
              file "$RESOURCES/$FILE" | grep -q "$EXPECTED_MACHO_ARCH"
            done
            file "$RESOURCES/Effekseer.dll" | grep -q "$EXPECTED_MANAGED_ARCH"

            if find "$RESOURCES" -maxdepth 1 -type d -name 'osx-*' | grep -q .; then
              echo "A RID-specific intermediate directory leaked into $APP" >&2
              exit 1
            fi
          done

      - name: Validate macOS notarization secrets
        if: matrix.name == 'mac' && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          for name in \
            APPLE_CERT_P12_BASE64 \
            APPLE_CERT_P12_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_NOTARY_APPLE_ID \
            APPLE_NOTARY_TEAM_ID \
            APPLE_NOTARY_APP_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Setup macOS signing keychain
        if: matrix.name == 'mac' && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/effekseer-build-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/effekseer-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Notarize macOS tool
        if: matrix.name == 'mac' && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          NOTARYTOOL_PROFILE: effekseer-notarytool-ci
        run: |
          for ARCH in arm64 x64
          do
            RID="osx-$ARCH"
            SIGN_WORKDIR="$RUNNER_TEMP/notarization-$ARCH"
            rm -rf "$SIGN_WORKDIR"
            mkdir -p "$SIGN_WORKDIR/Effekseer"
            cp \
              Script/Notarization_Mac/Effekseer_cert.sh \
              Script/Notarization_Mac/Effekseer_notarytool_setup.sh \
              Script/Notarization_Mac/entitlements.plist \
              "$SIGN_WORKDIR/"
            cp -R "build/macos-packaging/$RID/Effekseer.app" "$SIGN_WORKDIR/Effekseer/"
            (
              cd "$SIGN_WORKDIR"
              sh Effekseer_notarytool_setup.sh \
                "$APPLE_NOTARY_APPLE_ID" \
                "$APPLE_NOTARY_TEAM_ID" \
                "$APPLE_NOTARY_APP_PASSWORD" \
                "$NOTARYTOOL_PROFILE"
              sh Effekseer_cert.sh "$APPLE_SIGNING_IDENTITY" "$NOTARYTOOL_PROFILE"
            )
            cp "$SIGN_WORKDIR/Effekseer.dmg" "EffekseerTool/Mac-$ARCH/Effekseer.dmg"
          done

      - name: Upload macOS notarization logs
        if: failure() && matrix.name == 'mac' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EffekseerNotarizationLogs
          path: |
            ${{ runner.temp }}/notarization-arm64/Effekseer-app-notarytool-log.json
            ${{ runner.temp }}/notarization-arm64/Effekseer-dmg-notarytool-log.json
            ${{ runner.temp }}/notarization-x64/Effekseer-app-notarytool-log.json
            ${{ runner.temp }}/notarization-x64/Effekseer-dmg-notarytool-log.json
          if-no-files-found: ignore

      - name: Prepare ForCpp
        if: matrix.name == 'windows_x64'
        run: |
          python release_cpp.py
        shell: cmd
        
      - name: Prepare Windows Tool
        run: |
          python release_tool.py
        if: matrix.name == 'windows_x64'
        shell: cmd

      - name: Upload ForCpp
        if: matrix.name == 'windows_x64'
        uses: actions/upload-artifact@v4
        with:
          name: EffekseerForCpp${{ steps.version.outputs.value }}
          path: EffekseerForCpp

      - name: Upload Windows Tool
        if: matrix.name == 'windows_x64'
        uses: actions/upload-artifact@v4
        with:
          name: Effekseer${{ steps.version.outputs.value }}Win
          path: EffekseerTool

      - name: Upload macOS arm64 Tool
        if: matrix.name == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: Effekseer${{ steps.version.outputs.value }}Mac-arm64
          path: EffekseerTool/Mac-arm64

      - name: Upload macOS x64 Tool
        if: matrix.name == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: Effekseer${{ steps.version.outputs.value }}Mac-x64
          path: EffekseerTool/Mac-x64

  Deploy:
    needs: [tests,BuildLinux,Build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Effekseer version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 -c 'import build; print(build.get_editor_version())')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: Effekseer${{ steps.version.outputs.value }}Win
          path: dist/Effekseer${{ steps.version.outputs.value }}Win
                
      - uses: actions/download-artifact@v4
        with:
          name: Effekseer${{ steps.version.outputs.value }}Linux
          path: dist/Effekseer${{ steps.version.outputs.value }}Linux
      
      - uses: actions/download-artifact@v4
        with:
          name: EffekseerForCpp${{ steps.version.outputs.value }}
          path: dist/EffekseerForCpp${{ steps.version.outputs.value }}
      
      - uses: actions/download-artifact@v4
        with:
          name: Effekseer${{ steps.version.outputs.value }}Mac-arm64
          path: dist/Effekseer${{ steps.version.outputs.value }}Mac-arm64

      - uses: actions/download-artifact@v4
        with:
          name: Effekseer${{ steps.version.outputs.value }}Mac-x64
          path: dist/Effekseer${{ steps.version.outputs.value }}Mac-x64
      
      - name: Prepare Release
        run: |
          mkdir -p pub
          chmod +x \
            dist/Effekseer${{ steps.version.outputs.value }}Linux/Tool/Effekseer \
            dist/Effekseer${{ steps.version.outputs.value }}Linux/Tool/bin/Effekseer \
            dist/Effekseer${{ steps.version.outputs.value }}Linux/Tool/bin/EffekseerMaterialEditor \
            dist/Effekseer${{ steps.version.outputs.value }}Linux/Tool/bin/tools/EffekseerResourceConverter || true
          cd dist
          for asset in \
            "Effekseer${{ steps.version.outputs.value }}Win" \
            "Effekseer${{ steps.version.outputs.value }}Linux" \
            "Effekseer${{ steps.version.outputs.value }}Mac-arm64" \
            "Effekseer${{ steps.version.outputs.value }}Mac-x64" \
            "EffekseerForCpp${{ steps.version.outputs.value }}"
          do
            zip -r "../pub/$asset.zip" "$asset"
          done
          
      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: EffekseerReleaseAll
          path: pub

      - name: Deploy to Github Releases
        if: github.event_name == 'release'
        run: |
          releaseId=$(jq --raw-output '.release.id' ${GITHUB_EVENT_PATH})
          echo "Upload to release $releaseId"
          for filename in \
            "Effekseer${{ steps.version.outputs.value }}Win.zip" \
            "Effekseer${{ steps.version.outputs.value }}Linux.zip" \
            "Effekseer${{ steps.version.outputs.value }}Mac-arm64.zip" \
            "Effekseer${{ steps.version.outputs.value }}Mac-x64.zip" \
            "EffekseerForCpp${{ steps.version.outputs.value }}.zip"
          do
            url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$releaseId/assets?name=$(basename $filename)"
            echo "Upload $filename to $url"
            curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/binary" \
            --data-binary @"pub/$filename" \
            "$url"
          done
        
